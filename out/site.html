@font-face{font-family:Jost;src:url(../fonts/Jost.ttf);font-weight:100 900}
:root{--ink:#0A0908;--graph:#15100C;--amber:#E39A2D;--copper:#C9862A;--cream:#F3EDE2;--bordo:#9C2F25;--muted:rgba(243,237,226,.62);--line:rgba(201,134,42,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:Jost,Arial,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
a{color:inherit}
h1,h2,h3,.o{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:500;text-transform:uppercase;line-height:1.05}
.k{font-size:13px;font-weight:600;letter-spacing:4px;color:var(--amber);text-transform:uppercase}
.bars{display:flex;gap:18px;align-items:flex-end;margin:16px 0 0}.bars i{width:90px;height:5px;background:var(--bordo)}.bars u{width:220px;height:2px;background:var(--amber);margin-bottom:1px}
.hatch{height:34px;background:repeating-linear-gradient(135deg,rgba(227,154,45,.7) 0 2px,transparent 2px 12px);border-bottom:2px solid var(--amber)}
.bev{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.card{position:relative;background:linear-gradient(180deg,rgba(21,16,12,.95),rgba(10,9,8,.95));border:1px solid var(--line);border-left:3px solid var(--copper);padding:22px 24px}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 14px Jost;letter-spacing:3px;text-transform:uppercase;padding:14px 26px;border:0;cursor:pointer;background:var(--amber);color:var(--ink);text-decoration:none;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.2s}
.btn:hover{background:#f1ad44;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--copper)}
.btn.sm{padding:9px 16px;font-size:12px;letter-spacing:2px}
.btn.red{background:var(--bordo);color:var(--cream)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--copper);color:var(--amber)}
.tag.ok{background:var(--amber);color:var(--ink);border-color:var(--amber)}.tag.no{border-color:var(--bordo);color:#e0786e}.tag.mute{border-color:rgba(243,237,226,.25);color:var(--muted)}
.demo{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
/* шапка */
header.top{position:sticky;top:0;z-index:50;background:rgba(10,9,8,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:10px 24px}
.top img{height:46px;cursor:pointer}
.top nav{display:flex;gap:22px;flex:1}.top nav a{text-decoration:none;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.top nav a:hover{color:var(--amber)}
.roles{display:flex;border:1px solid var(--copper)}.roles button{background:none;border:0;color:var(--muted);font:600 12px Jost;letter-spacing:2px;text-transform:uppercase;padding:9px 14px;cursor:pointer}.roles button.on{background:var(--amber);color:var(--ink)}
/* лендинг */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:ken 14s ease-out both}
@keyframes ken{from{transform:scale(1.12)}to{transform:none}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,8,.96) 0%,rgba(10,9,8,.75) 40%,rgba(10,9,8,.15) 75%),linear-gradient(0deg,var(--ink) 0%,transparent 35%)}
.hero .in{position:relative;z-index:2;max-width:1320px;margin:0 auto;width:100%;padding:0 24px 90px}
.hero h1{font-size:clamp(54px,8vw,120px);max-width:900px;margin-top:18px}
.hero h1 span{color:var(--amber)}
.hero p.lead{font-size:21px;max-width:620px;margin:24px 0 34px;color:rgba(243,237,226,.88)}
.stats{display:flex;gap:44px;margin-top:54px;flex-wrap:wrap}.stats div b{display:block;font:500 46px Oswald;color:var(--amber);line-height:1}.stats div span{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
section.s{max-width:1320px;margin:0 auto;padding:96px 24px}
section.s h2{font-size:clamp(36px,4.4vw,60px);margin-top:10px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.about img{width:100%;height:520px;object-fit:cover;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px));filter:saturate(.9)}
.about ul{list-style:none;margin-top:26px}.about li{position:relative;padding-left:30px;margin:14px 0;font-size:19px}.about li:before{content:"";position:absolute;left:3px;top:11px;width:10px;height:10px;background:var(--amber);transform:rotate(45deg)}
.block{position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;border:1px solid var(--line);cursor:pointer;transition:.3s}
.block img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.block:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,9,8,.97) 20%,rgba(10,9,8,.35) 75%)}
.block:hover img{transform:scale(1.06)}.block:hover{border-color:var(--amber)}
.block>*:not(img){position:relative;z-index:2}.block h3{font-size:30px;margin:8px 0 6px}.block .n{font:500 60px Oswald;color:var(--amber);line-height:1}
.lessons{margin-top:26px;display:none}.lessons.on{display:grid}
.lesson{display:flex;gap:14px;align-items:baseline;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--copper);background:rgba(21,16,12,.8);text-decoration:none}
.lesson b{font:500 18px Oswald;color:var(--amber);min-width:44px}.lesson:hover{border-left-color:var(--amber);background:rgba(227,154,45,.08)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:44px;position:relative}
.path .st{padding:0 22px 30px 0;position:relative}.path .st:before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:var(--line)}
.path .st i{position:relative;display:block;width:16px;height:16px;border:3px solid var(--amber);background:var(--ink);transform:rotate(45deg);margin:36px 0 22px}
.path .st b{font:500 36px Oswald;color:var(--amber)}.path h3{font-size:22px;margin-bottom:6px}.path p{color:var(--muted);font-size:15px}
.cert{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.cert img{width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px var(--line)}
.cta{position:relative;overflow:hidden;padding:80px 24px;text-align:center;background:radial-gradient(ellipse at 50% 60%,#3A1D10,var(--ink) 70%)}
footer{border-top:1px solid var(--line);padding:30px 24px;text-align:center;color:var(--muted);font-size:13px;letter-spacing:2px}
/* модалка */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,4,4,.8);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--graph);border:1px solid var(--copper);max-width:560px;width:100%;padding:36px;max-height:90vh;overflow:auto}
.modal .box.wide{max-width:1000px}
label{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input,select,textarea{width:100%;background:rgba(10,9,8,.8);border:1px solid var(--line);color:var(--cream);font:16px Jost;padding:12px 14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
/* кабинеты */
.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 67px)}
.side{border-right:1px solid var(--line);padding:26px 16px;background:linear-gradient(180deg,#120d0a,var(--ink))}
.side .who{padding:0 10px 22px;border-bottom:1px solid var(--line);margin-bottom:16px}.side .who b{display:block;font:500 22px Oswald;text-transform:uppercase}
.side a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;text-decoration:none;color:var(--muted);font-size:15px;border-left:3px solid transparent}
.side a:hover{color:var(--cream)}.side a.on{color:var(--cream);border-left-color:var(--amber);background:rgba(227,154,45,.08)}
.side a em{font-style:normal;font-size:11px;background:var(--bordo);color:var(--cream);padding:1px 7px}
.main{padding:34px 40px 60px;max-width:1200px}
.main h2{font-size:42px;margin:8px 0 6px}
.bar{height:8px;background:rgba(243,237,226,.1);position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--copper),var(--amber));transition:width .8s}
.row{display:flex;align-items:center;gap:16px}
.lvl{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0}
.lvl .card{padding:18px}.lvl .card.lock{opacity:.45}.lvl .card.cur{border-left-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.lvl .n{font:500 34px Oswald;color:var(--amber);line-height:1}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);padding:10px 12px;border-bottom:1px solid var(--copper)}
td{padding:12px;border-bottom:1px solid rgba(201,134,42,.2);vertical-align:middle}
tr:hover td{background:rgba(227,154,45,.04)}
.ls{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);margin-bottom:8px;background:rgba(21,16,12,.7)}
.ls b{font:500 18px Oswald;color:var(--amber);min-width:46px}.ls span.t{flex:1}
.ls.done{border-left:3px solid var(--amber)}.ls.lock{opacity:.4}
.badge{text-align:center;padding:24px 14px}.badge svg{width:84px;height:84px}.badge.off{opacity:.3;filter:grayscale(1)}
.badge h3{font-size:18px;margin:12px 0 4px}.badge p{font-size:13px;color:var(--muted)}
.chat{border:1px solid var(--line);background:rgba(21,16,12,.7);display:flex;flex-direction:column;height:520px}
.chat .msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:70%}.msg .h{font-size:12px;color:var(--amber);letter-spacing:1px;margin-bottom:3px}.msg .b{background:rgba(243,237,226,.07);padding:10px 14px}
.msg.me{align-self:flex-end}.msg.me .b{background:rgba(227,154,45,.18)}.msg.mod .h{color:#e0786e}
.chat form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}.chat form input{flex:1}
.q{margin:22px 0}.q h3{font-size:22px;text-transform:none;font-family:Jost;font-weight:500;margin-bottom:10px}
.opt{display:block;padding:12px 16px;border:1px solid var(--line);margin:8px 0;cursor:pointer;transition:.15s}.opt:hover{border-color:var(--amber)}
.opt.sel{border-color:var(--amber);background:rgba(227,154,45,.12)}.opt.right{background:var(--amber);color:var(--ink);border-color:var(--amber)}.opt.wrong{border-color:var(--bordo);background:rgba(156,47,37,.25)}
.kpi{padding:22px}.kpi b{display:block;font:500 44px Oswald;color:var(--amber);line-height:1}.kpi span{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.certbox{position:relative}.certbox img{width:100%;display:block}
.certbox .nm{position:absolute;left:5.6%;top:44.9%;width:55.2%;height:5.6%;display:flex;align-items:center;justify-content:center;font:500 clamp(14px,2.2vw,30px) Oswald;color:#0A0908;text-transform:uppercase;letter-spacing:1px}
.note{border-left:3px solid var(--amber);padding:10px 16px;background:rgba(227,154,45,.06);color:rgba(243,237,226,.85);font-size:15px;margin:16px 0}
.toast{position:fixed;right:24px;bottom:24px;z-index:200;background:var(--amber);color:var(--ink);padding:14px 22px;font-weight:600;transform:translateY(120px);transition:.35s}
.toast.on{transform:none}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.reveal.in{opacity:1;transform:none}
@media (max-width:900px){.about,.cert,.app{grid-template-columns:1fr}.path{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.lvl{grid-template-columns:1fr 1fr}.top nav{display:none}.side{border-right:0}}
</style>
</head>

<script>

function say(key, t, mod) {
  if (!t.trim()) return; S[key].push({ who: mod ? 'Координатор' : S.me.name, t, me: !mod, mod: !!mod });
  if (key === 'support' && !mod) setTimeout(() => { S.support.push({ who: 'Поддержка', mod: true, t: 'Приняли! Передали координатору потока, ответим сегодня.' }); render(); }, 900);
  render(); setTimeout(() => { const m = $('#msgs'); if (m) m.scrollTop = 1e6; }, 30);
}
function delMsg(key, n) { S[key].splice(n, 1); toast('Сообщение удалено модератором'); render(); }
function uCert() {
  const ok = passed(4);
  return head('Сертификат', ok ? 'Поздравляем!' : 'Сертификат ещё впереди', ok ? 'Электронная версия готова, печатная будет отправлена координатором.' : `Пройдите все 5 блоков и сдайте тесты. Сейчас пройдено ${totalProg()}% курса.`) +
    `<div class="certbox" style="margin-top:26px;max-width:900px;${ok ? '' : 'opacity:.35;filter:grayscale(.6)'}"><img src="../cert.jpg" alt=""><div class="nm">${esc(S.me.name)}</div></div>
    ${ok ? '' : `<div class="note">Для демонстрации можно «пройти» курс мгновенно: <a href="#" onclick="event.preventDefault();demoFinish()">завершить все тесты</a>.</div>`}`;
}
function demoFinish() { allLessons().forEach(l => S.done.add(l.num)); DATA.blocks.forEach((b, i) => S.tests[i] = { score: b.quiz.length, total: b.quiz.length }); toast('Демо: курс завершён'); render(); }

// ---------- КАБИНЕТ АДМИНИСТРАТОРА ----------
function aHome() {
  const nw = S.apps.filter(a => a.st === 'new').length, act = S.users.filter(u => u.st !== 'blocked').length;
  const avg = Math.round(S.users.reduce((s, u) => s + u.score, 0) / S.users.length);
  return head('Администратор · поток №3', 'Обзор школы') + `<div class="grid g4" style="margin-top:26px">
  <div class="card kpi"><b>${nw}</b><span>новых заявок</span></div><div class="card kpi"><b>${act}</b><span>активных участников</span></div>
  <div class="card kpi"><b>${avg}%</b><span>средний балл тестов</span></div><div class="card kpi"><b>${S.users.filter(u => u.cert === 'ready').length}</b><span>сертификатов к отправке</span></div></div>
  <h3 style="font-size:24px;margin:34px 0 12px">Прогресс участников</h3>${S.users.map(u => `<div class="row" style="margin:10px 0"><span style="width:220px">${esc(u.name)}</span><div style="flex:1">${bar(u.prog)}</div><span class="demo" style="width:60px;text-align:right">${u.prog}%</span></div>`).join('')}
  <div class="note">Все люди, даты и цифры в кабинете администратора — демонстрационные.</div>`;
}
function aApps() {
  return head('Заявки', 'Обработка заявок', 'Одобрение заявки назначает курс и поток — участник получает доступ в личный кабинет.') + `<table style="margin-top:24px"><tr><th>Дата</th><th>Имя</th><th>Подразделение</th><th>Допуск</th><th>Статус</th><th></th></tr>${S.apps.map(a => `<tr><td>${a.date}</td><td>${esc(a.name)}</td><td>${esc(a.dept)}</td><td>${docCell(a.doc)}</td><td>${a.st === 'new' ? '<span class="tag">новая</span>' : a.st === 'ok' ? '<span class="tag ok">' + esc(a.course) + '</span>' : '<span class="tag no">отклонена</span>'}</td><td>${a.st === 'new' ? `<button class="btn sm" onclick="assign(${a.id})">Назначить курс</button> <button class="btn sm ghost" onclick="rej(${a.id})">Отклонить</button>` : ''}</td></tr>`).join('')}</table>`;
}
function docCell(d) { return !d ? '<span class="tag no">нет документа</span>' : d.t === 'url' ? '<a href="' + esc(d.v) + '" target="_blank" style="color:var(--amber)">ссылка Битрикс ↗</a>' : '<span class="tag">📎 ' + esc(d.v) + '</span>'; }
function assign(id) {
  const a = S.apps.find(x => x.id === id);
  modal(`<div class="k">Назначение курса</div><h2 style="font-size:32px;margin:8px 0">${esc(a.name)}</h2><label>Документ о допуске</label><div>${docCell(a.doc)}</div>${a.doc ? '' : '<div class="note" style="border-left-color:var(--bordo)">Документ не приложен — запросите его у участника в Битрикс24 перед назначением курса.</div>'}<label>Курс</label><select><option>Школа амбассадоров ТАРКОС — полный курс (5 блоков)</option><option>Экспресс: блоки 1–3</option></select><label>Поток</label><select id="flow"><option>Поток №3 (старт 01.10.2026)</option><option>Поток №4 (старт 01.11.2026)</option></select><label>Куратор</label><select><option>Координатор школы</option></select>
  <div class="row" style="margin-top:22px"><button class="btn" onclick="doAssign(${id})">Назначить</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`);
}
function doAssign(id) { const a = S.apps.find(x => x.id === id); a.st = 'ok'; a.course = $('#flow').value.split(' (')[0]; S.users.push({ name: a.name, dept: a.dept, lvl: 1, prog: 0, score: 0, st: 'act' }); closeModal(); toast('Курс назначен, приглашение отправлено'); render(); }
function rej(id) { S.apps.find(x => x.id === id).st = 'no'; toast('Заявка отклонена'); render(); }
function aUsers() {
  return head('Участники', 'Контроль прохождения') + `<table style="margin-top:24px"><tr><th>Участник</th><th>Подразделение</th><th>Уровень</th><th>Прогресс</th><th>Тесты</th><th>Статус</th><th></th></tr>${S.users.map((u, n) => `<tr><td>${esc(u.name)}</td><td>${esc(u.dept)}</td><td class="o" style="color:var(--amber)">${u.lvl}</td><td style="width:160px">${bar(u.prog)}</td><td>${u.score ? u.score + '%' : '—'}</td><td>${u.st === 'blocked' ? '<span class="tag no">заблокирован</span>' : u.st === 'warn' ? '<span class="tag">предупреждение</span>' : '<span class="tag ok">активен</span>'}</td><td>${u.st === 'blocked' ? `<button class="btn sm ghost" onclick="unblock(${n})">Разблокировать</button>` : `<button class="btn sm red" onclick="block(${n})">Блокировать</button>`}</td></tr>`).join('')}</table>`;
}
function block(n) { S.users[n].st = 'blocked'; toast('Доступ участника заблокирован'); render(); }
function unblock(n) { S.users[n].st = 'act'; toast('Доступ восстановлен'); render(); }
function aTests() {
  return head('Тесты', 'Контроль тестов по разделам', 'Средний балл и доля сдавших по каждому блоку.') + `<table style="margin-top:24px"><tr><th>Блок</th><th>Вопросов</th><th>Сдали</th><th>Средний балл</th><th>Проблемный вопрос</th></tr>${DATA.blocks.map((b, i) => `<tr><td>${i + 1}. ${esc(b.title)}</td><td>${b.quiz.length}</td><td style="width:180px">${bar([83, 67, 50, 33, 33][i])}</td><td>${[88, 81, 76, 84, 90][i]}%</td><td style="color:var(--muted);font-size:14px">${esc((b.quiz[1] || b.quiz[0]).q)}</td></tr>`).join('')}</table><div class="demo" style="margin-top:12px">Статистика — демонстрационная; вопросы — реальные из уроков</div>`;
}
function aSchedule() {
  return head('Расписание', 'Очные и онлайн-семинары', 'Администратор создаёт занятия, участники записываются из личного кабинета.') + `<table style="margin-top:24px"><tr><th>Дата</th><th>Занятие</th><th>Место</th><th>Уровень</th><th>Записано</th></tr>${S.sessions.map(s => `<tr><td class="o" style="color:var(--amber)">${s.date} · ${s.time}</td><td>${esc(s.title)}</td><td>${esc(s.place)}</td><td>${s.lvl}</td><td style="width:200px">${bar(Math.round((s.cap - s.seats + (S.booked.has(s.id) ? 1 : 0)) / s.cap * 100))}<span class="demo">${s.cap - s.seats + (S.booked.has(s.id) ? 1 : 0)}/${s.cap}</span></td></tr>`).join('')}</table>
  <div class="card" style="margin-top:28px"><div class="k">Новое занятие</div><form onsubmit="event.preventDefault();addSession(this)" class="grid g4" style="align-items:end"><div><label>Название</label><input name="t" required placeholder="Например: практикум по голосу"></div><div><label>Дата</label><input name="d" type="date" required></div><div><label>Мест</label><input name="c" type="number" value="15" min="1"></div><div><label>С уровня</label><select name="l"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div style="grid-column:1/-1"><button class="btn">Добавить в расписание</button></div></form></div>`;
}
function addSession(f) { const d = f.d.value.split('-').reverse().join('.'); S.sessions.push({ id: Date.now(), title: f.t.value, date: d, time: '18:00', place: 'Уточняется', cap: +f.c.value, seats: +f.c.value, lvl: +f.l.value }); toast('Занятие добавлено — участники увидят его в кабинете'); render(); }
function aCerts() {
  const list = S.users.filter(u => u.prog === 100 || u.cert);
  return head('Сертификаты', 'Создание и отправка', 'Сертификат формируется для участников, прошедших все уровни. Контроль отправки электронной и печатной версии.') + `<table style="margin-top:24px"><tr><th>Участник</th><th>Балл</th><th>Электронный</th><th>Печатный</th><th></th></tr>${list.map(u => `<tr><td>${esc(u.name)}</td><td>${u.score}%</td><td>${u.cert === 'sent' || u.certE ? '<span class="tag ok">отправлен</span>' : '<span class="tag">готов</span>'}</td><td>${u.cert === 'sent' ? '<span class="tag ok">вручён</span>' : u.certP ? '<span class="tag ok">отправлен почтой</span>' : '<span class="tag mute">не отправлен</span>'}</td><td><button class="btn sm" onclick="certPrev('${esc(u.name)}')">Сформировать</button></td></tr>`).join('')}</table>`;
}
function certPrev(name) {
  modal(`<div class="k">Предпросмотр</div><h2 style="font-size:30px;margin:8px 0 18px">Сертификат · ${esc(name)}</h2><div class="certbox"><img src="../cert.jpg" alt=""><div class="nm">${esc(name)}</div></div>
  <div class="row" style="margin-top:22px"><button class="btn" onclick="certSend('${esc(name)}','e')">Отправить на e-mail</button><button class="btn ghost" onclick="certSend('${esc(name)}','p')">Отправить печатный</button><button class="btn ghost" onclick="closeModal()">Закрыть</button></div>`, true);
}
function certSend(name, k) { const u = S.users.find(x => x.name === name); if (u) u[k === 'e' ? 'certE' : 'certP'] = true; closeModal(); toast(k === 'e' ? 'Электронный сертификат отправлен' : 'Печатный сертификат передан в отправку'); render(); }
function aRules() {
  return head('Нарушители', 'Алгоритм блокировки', 'Проект алгоритма для согласования: прозрачная эскалация вместо внезапной блокировки.') + `<div class="path" style="grid-template-columns:repeat(3,1fr)">${[['01', 'Предупреждение', 'Личное сообщение модератора со ссылкой на правило потока'], ['02', 'Ограничение чата', 'Временный запрет писать в чат потока (7 дней)'], ['03', 'Блокировка доступа', 'Доступ к курсу закрывается, решение фиксируется администратором']].map(s => `<div class="st"><b>${s[0]}</b><i></i><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div>
  <h3 style="font-size:24px;margin:20px 0 12px">Под наблюдением</h3><table><tr><th>Участник</th><th>Нарушение</th><th>Этап</th><th></th></tr>
  ${S.users.map((u, n) => u.st === 'warn' || u.st === 'blocked' ? `<tr><td>${esc(u.name)}</td><td>${u.st === 'warn' ? 'Оскорбительные сообщения в чате' : 'Повторное нарушение правил чата'}</td><td>${u.st === 'warn' ? '<span class="tag">01 · предупреждение</span>' : '<span class="tag no">03 · блокировка</span>'}</td><td>${u.st === 'blocked' ? `<button class="btn sm ghost" onclick="unblock(${n})">Разблокировать</button>` : `<button class="btn sm red" onclick="block(${n})">Эскалировать</button>`}</td></tr>` : '').join('')}</table>`;
}
function aMap() {
  const C = [['Подача заявки', '#/', 'Лендинг → «Подать заявку»'], ['Создание ЛК', '#/me', 'После одобрения заявки'], ['Прохождение уроков', '#/me/lessons', '49 уроков-презентаций'], ['Фиксация прогресса', '#/me', 'Прогресс по блокам и курсу'], ['Тестирование', '#/me/tests', 'Тесты по блокам из вопросов уроков'], ['Получение ачивок', '#/me/badges', '7 ачивок'], ['Переход к следующему уровню', '#/me', 'Уровень = блок, порог 70%'], ['Очные занятия: расписание, запись', '#/me/schedule', 'Запись и отмена'], ['Чат потока и поддержки', '#/me/chat', 'Два чата']];
  const A = [['Обработка заявок', '#/admin/apps'], ['Назначение курса', '#/admin/apps'], ['Контроль тестов по разделам', '#/admin/tests'], ['Онлайн-расписание семинаров', '#/admin/schedule'], ['Администрирование чата потока', '#/admin/chat'], ['Чат поддержки', '#/admin/support'], ['Создание сертификатов', '#/admin/certs'], ['Контроль отправки сертификатов', '#/admin/certs'], ['Алгоритм блокировки нарушителей', '#/admin/rules']];
  const li = (x, role) => `<div class="ls done"><span class="tag ok">MVP</span><span class="t">${x[0]}${x[2] ? `<span class="demo" style="display:block">${x[2]}</span>` : ''}</span><button class="btn sm ghost" onclick="S.role='${role}';go('${x[1]}')">Показать</button></div>`;
  return head('Требования из ТЗ', 'Карта MVP', 'Все 18 пунктов клиентского и административного контуров показаны в прототипе. Бэкенд, авторизация и интеграция с Битрикс — следующий этап.') +
    `<div class="grid g2" style="margin-top:24px"><div><h3 style="font-size:22px;margin-bottom:12px">Клиентский контур · 9/9</h3>${C.map(x => li(x, 'user')).join('')}</div><div><h3 style="font-size:22px;margin-bottom:12px">Административный контур · 9/9</h3>${A.map(x => li(x, 'admin')).join('')}</div></div>`;
}

// ---------- роутер ----------
function render() {
  const h = location.hash || '#/';
  if (h.startsWith('#/me')) S.role = 'user'; else if (h.startsWith('#/admin')) S.role = 'admin';
  document.querySelectorAll('#roles button').forEach(b => b.classList.toggle('on', b.dataset.r === S.role));
  let v;
  if (h === '#/' || h === '#program' || h === '') v = landing();
  else if (h.startsWith('#/me')) {
    const p = h.split('/')[2] || '';
    const body = p === 'lessons' ? uLessons() : p === 'tests' ? uTests() : p === 'test' ? uTest(+h.split('/')[3]) : p === 'badges' ? uBadges() : p === 'schedule' ? uSchedule() : p === 'chat' ? chatView(S.chat, 'chat', 'Чат потока', 'Поток №3') : p === 'support' ? chatView(S.support, 'support', 'Поддержка', 'Чат с координатором') : p === 'cert' ? uCert() : uHome();
    v = shell(MENU_U, S.me.name, 'Участник · поток №3', body);
  } else if (h.startsWith('#/admin')) {
    const p = h.split('/')[2] || '';
    const body = p === 'apps' ? aApps() : p === 'users' ? aUsers() : p === 'tests' ? aTests() : p === 'schedule' ? aSchedule() : p === 'chat' ? chatView(S.chat, 'chat', 'Модерация', 'Чат потока №3', true) : p === 'support' ? chatView(S.support, 'support', 'Поддержка', 'Обращения участников', true) : p === 'certs' ? aCerts() : p === 'rules' ? aRules() : p === 'map' ? aMap() : aHome();
    v = shell(MENU_A, 'Координатор школы', 'Администратор', body);
  } else v = landing();
  $('#view').innerHTML = v;
  if (h === '#program') setTimeout(() => $('#program') && $('#program').scrollIntoView(), 30); else if (!h.startsWith('#/me/chat') && !h.startsWith('#/admin/chat')) window.scrollTo(0, 0);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(e => io.observe(e));
}
addEventListener('hashchange', render);
if (!location.hash) location.hash = S.role === 'user' ? '#/me' : S.role === 'admin' ? '#/admin' : '#/';
render();
</script>
</body>
</html>
